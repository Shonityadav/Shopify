# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "98023666c814430856052792c73cba5a"
name = "AceStore"
application_url = "https://practitioners-territories-pts-gone.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true


[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders_updated"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app.scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/webhooks/customers/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders_create"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app_uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "customers/update" ]
  uri = "/webhooks/customers/update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_cart_transforms,write_cart_transforms,read_customers,write_customers,read_discounts,write_discounts,read_metaobject_definitions,write_metaobject_definitions,read_orders,write_orders,read_products,write_products,read_publications,write_publications,read_purchase_options,write_purchase_options,customer_write_customers,customer_read_customers"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://practitioners-territories-pts-gone.trycloudflare.com/auth/callback"
]

[[extensions]]
path = "extensions/vip-bundle-discount"
type = "function"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[shop.metafields.vip.pass_variant_id]
type = "single_line_text_field"
name = "VIP Membership Variant GID"
description = "Variant GID for VIP membership product (e.g. gid://shopify/ProductVariant/123)"

  [shop.metafields.vip.pass_variant_id.access]
  admin = "merchant_read_write"

[shop.metafields.vip.subscribe_plan_id]
type = "single_line_text_field"
name = "Subscribe & Save Selling Plan GID"
description = "Selling plan GID for Subscribe & Save (e.g. gid://shopify/SellingPlan/123)"

  [shop.metafields.vip.subscribe_plan_id.access]
  admin = "merchant_read_write"


[app_proxy]
url = "https://practitioners-territories-pts-gone.trycloudflare.com"
subpath = "integrated-sale-app"
prefix = "apps"
