# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e03ecaff7a3d667a6d36ab8b807afa37"
name = "integrated-sale-app"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app_uninstalled"

[[webhooks.subscriptions]]
topics = [ "orders/create" ]
uri = "/webhooks/orders_create"

[[webhooks.subscriptions]]
topics = ["orders/updated"]
uri = "/webhooks/orders_updated"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = [ "customers/update" ]
uri = "/webhooks/customers/update"

[[webhooks.subscriptions]]
topics = [ "customers/create" ]
uri = "/webhooks/customers/create"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders/paid"



[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,customer_read_customers,read_orders,read_cart_transforms,write_cart_transforms,read_products,write_discounts,write_metaobject_definitions,write_orders,write_products,read_publications,write_publications,write_purchase_options,read_purchase_options"

[auth]
redirect_urls = [
  "https://hartford-beverages-validation-whenever.trycloudflare.com/auth/callback"
]

[[extensions]]
path = "extensions/vip-bundle-discount"
type = "function"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
